<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Blackbaud Next</title>
    <link rel="stylesheet" href="dist/popup.css" />
  </head>
  <body>
    <header><img src="assets/blackbaud.png" width="24" height="24" alt="" /><h1>Blackbaud Next</h1></header>
    <main>
      <fieldset class="modes" aria-label="Extension mode">
        <div class="mode-buttons"><label><input id="mode-off" type="radio" name="mode" value="off" disabled /><span>Off</span></label>
        <label title="Automatic sign-in and assignment previews"><input id="mode-essentials" type="radio" name="mode" value="essentials" aria-describedby="essentials-description" disabled /><span>Essentials</span></label>
        <label><input id="mode-full" type="radio" name="mode" value="full" disabled /><span>Full<small id="customized" hidden>Customized</small></span></label></div>
      </fieldset>
      <span id="essentials-description" hidden>Automatic sign-in and assignment previews.</span>
      <button id="reset-full" class="text-button" type="button" hidden>Reset Full defaults</button>
      <div id="load-error" hidden><p>Couldn’t load your settings.</p><button id="retry" type="button">Try again</button></div>
      <p id="save-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
    </main>
    <footer>
      <a href="options.html" target="_blank" rel="noopener">Settings</a>
      <span aria-hidden="true">•</span>
      <a href="mailto:colin@colinkim.dev">Having trouble?</a>
    </footer>
    <script src="dist/popup.js"></script>
  </body>
</html>
